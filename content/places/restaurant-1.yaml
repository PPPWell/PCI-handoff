translations:
  zh:
    slug: pastation-firenze
    name: PaStation Firenze
    highlight: 在 Via Porta Rossa 享用豪华套餐，午餐或晚餐时段均可，标价 €27，凭券 €19。
    reasons:
      - 店铺位于佛罗伦萨历史中心的 Via Porta Rossa，门口可见 PaStation 的蝴蝶意面招牌。
      - 先免费领券，到店点券上对应的豪华套餐时出示。店员核销后立减 €8，餐费直接付给餐厅。
    story: 街边的座位、亮着灯的店门，照片里能看到这家店的样子。地址、电话和营业时段已据 PaStation 官网核对；菜品请在点单前向店员确认。
    practicalTips: 官网列出每天12:00–22:30营业，均为意大利当地时间。出发前可致电 +39 055 291184 核对营业与座位；两款豪华套餐券都只在午餐 12:00–13:00 或晚餐 15:00–22:30 使用，请在这两个时段到店。
    suitableFor: 想在市中心享用意式套餐，并使用 €8 优惠券的你。
  it:
    slug: pastation-firenze
    name: PaStation Firenze
    highlight: Menù Deluxe in Via Porta Rossa, a pranzo o a cena, da 27 € a 19 € con il coupon.
    reasons:
      - PaStation si trova in Via Porta Rossa, nel centro storico di Firenze.
        All’ingresso trovi l’insegna con le farfalle.
      - "Il coupon è gratuito: mostralo quando ordini il menù Deluxe indicato
        sul coupon. Lo staff lo convalida e paghi il pasto al ristorante
        con 8 € di sconto."
    story: Le foto mostrano l’ingresso e i tavolini sulla strada. Indirizzo,
      telefono e orari sono stati controllati sul sito di PaStation; chiedi allo
      staff di confermare i piatti prima di ordinare.
    practicalTips: Il sito indica l’apertura tutti i giorni dalle 12:00 alle 22:30,
      ora italiana. Prima di andare puoi chiamare il +39 055 291184 per
      confermare orari e disponibilità. I coupon dei due menù Deluxe valgono
      solo a pranzo (12:00–13:00) o a cena (15:00–22:30).
    suitableFor: Per un pranzo o una cena in centro, con 8 € di sconto sul menù Deluxe.
  en:
    slug: pastation-firenze
    name: PaStation Firenze
    highlight: "Deluxe menus on Via Porta Rossa for lunch or dinner: €27 or €19 with the coupon."
    reasons:
      - Find PaStation on Via Porta Rossa in Florence’s historic centre, marked
        by its bow-tie pasta sign.
      - Claim a free coupon and show it when ordering the matching Deluxe menu
        named on it. Staff redeem it for €8 off; pay for the meal at the
        restaurant.
    story: The supplied photos show the entrance and street-side tables. The
      address, phone and hours were checked against PaStation’s website. Ask
      staff to confirm the dishes before ordering.
    practicalTips: The website lists daily opening from 12:00 to 22:30, Italian
      local time. Call +39 055 291184 before visiting to confirm hours and
      availability. Both Deluxe coupons apply only at lunch (12:00–13:00) or dinner
      (15:00–22:30).
    suitableFor: Deluxe dining in central Florence with a €8 coupon discount.
