pages:
  about:
    status: published
    title: 关于中意公馆
    description: 我们为中国旅行者精选意大利的餐厅、景点、购物和住宿，帮你了解一个地方，再决定要不要去。
    sections:
      - id: story
        heading: 跨越山海，遇见心中所爱
        paragraphs:
          - 中意公馆，是一座架在云端的桥梁，也是一份连接中国与意大利的美好约定。
          - 我们的初心很简单：让好物、好店与好品牌跨越地域和语言，被更多人看见。让中国的优质产品走向更广阔的世界，也让欧洲独具魅力的品牌、生活方式与文化体验走近更多人的生活。
          - 品牌灵感源自意大利佛罗伦萨。这座孕育了文艺复兴的城市，拥有深厚的艺术传统与工艺积淀。从金匠、皮革到纺织，世代传承的匠心与对细节的珍视，让我们对品质与美好生活方式有更高的追求。
          - “中意”二字，既寓意中国与意大利的相遇，也藏着一句发自内心的“我很中意”。
          - 我们相信，真正值得分享的事物，总有打动人心的理由。因此，我们希望以真实的发现、用心的甄选和有温度的内容，连接不同文化的消费者、品牌与商家，让每一次相遇都创造新的可能。
          - 愿中意公馆成为一处有温度的云上空间，汇聚值得欣赏的美好，也让跨越山海的每一份心动，都有机会走进日常。
          - 中意公馆，让每一次发现，都值得中意。
      - id: selection
        heading: 我们怎么选店
        paragraphs:
          - 我们按口味、环境和适合的场合来挑选，也会收录没有合作的好店。有合作的店会明确标注。
      - id: contact
        heading: 联系我们
        paragraphs:
          - 想和我们合作，请查看[商业合作](/zh/partners/)。优惠券遇到问题，请写信至 [info@palazzoitaliacina.com](mailto:info@palazzoitaliacina.com)，附上领券邮箱和券面短码。
  editorial-policy:
    status: published
    title: 编辑准则
    description: 我们怎么选店，又怎么说明合作关系。
    sections:
      - id: independence
        heading: 独立撰写
        paragraphs:
          - 推荐理由由我们撰写。有合作的店，也会如实写下地址、营业时间和套餐内容。
      - id: disclosure
        heading: 合作披露
        paragraphs:
          - 店铺页面会标明“有专属套餐”“合作店铺”或“精选推荐，无合作”。
      - id: updates
        heading: 更正
        paragraphs:
          - 如果你发现地址、营业时间或其他信息有误，请告诉我们，我们会核对后更正。
  partners:
    status: published
    title: 商业合作
    description: 一起设计一份专属套餐，用中文、意大利语和英语，把你的餐厅介绍给更多食客。
    sections:
      - id: menu
        heading: 一起设计专属套餐
        paragraphs:
          - 从餐厅的招牌菜出发，确认分量、条件与真实价格。
      - id: story
        heading: 把餐厅介绍给更多人
        paragraphs:
          - 到店了解、拍摄，再把餐厅的菜品与故事写成中文、意大利语和英语内容。
      - id: purchase
        heading: 客人免费领券，到店使用
        paragraphs:
          - 客人先在网站免费领取专属优惠券，到店点单时出示给店员核销，餐费直接付给餐厅。客人仍直接向餐厅订位。
      - id: redeem
        heading: 点单时核销，照常上菜
        paragraphs:
          - 客人点单时，店员用手机打开商家网页核销。当天记录和账面明细都能查看，无需更换现有收银系统。
      - id: suppliers
        heading: 零售商与供应商
        paragraphs:
          - 如果你是零售商或供应商，欢迎写信至 palazzoitaliacina@gmail.com 洽谈合作。
  help:
    status: published
    title: 常见问题
    description: 领券、到店使用、邮箱登录与订阅：这里是你可能用得上的帮助。
    sections:
      - id: purchase
        heading: 领券与付款
        paragraphs:
          - 无需在线付款。先验证邮箱，免费领取 PaStation 豪华套餐 1 或豪华套餐 2 的优惠券（各立减 €8），再到店出示核销，餐费直接付给餐厅。
        questions:
          - question: 怎样领取和使用立减券？
            answer: 在 PaStation 门店页点击免费领取，验证邮箱后领券。到店点券上对应的套餐前出示给店员，并在券上写明的就餐时段内使用，核销后立减 €8。
          - question: 优惠券可以堂食，也可以外带吗？
            answer: 都可以。堂食和外带都能使用，点单时出示给店员核销，同样需要在券上写明的时段内。
          - question: 怎样找回优惠券？
            answer: 用领取时验证的邮箱登录“我的券”，即可找回优惠券。
      - id: booking
        heading: 订位
        paragraphs:
          - 你可以直接向餐厅订位，联系方式在餐厅页和券页。
        questions:
          - question: 怎么订位？
            answer: 查看餐厅支持的电话、WhatsApp 等方式，直接联系店员。需要意大利语订位说明时，可使用券页的订位信息工具。
          - question: 餐厅满座怎么办？
            answer: 先问问其他日期或时段。如果餐厅无法接待持券客人，请联系客户服务协助处理。
      - id: visit
        heading: 到店使用
        paragraphs:
          - 点单时就把券给店员看，由店员核销后上菜。遇到问题时，先保留券的短码。
        questions:
          - question: 店员不认识这张券怎么办？
            answer: 打开券页中的意大利语员工说明给店员看。如果仍无法处理，记下短码，再联系客户服务。
      - id: refunds
        heading: 退款与延期
        paragraphs:
          - "目前的优惠券都是免费领取，不需要在线付款，所以不涉及退款。券的有效期和可用的就餐时段写在券上，过期后不能使用。"
      - id: account
        heading: 账户与邮件
        paragraphs:
          - 用领取时验证的邮箱登录“我的券”，即可找回优惠券。
        questions:
          - question: 怎么登录？
            answer: 在“我的券”输入领券时填写的邮箱，再输入邮件中的六位验证码。若页面提示暂不可用，请稍后再试。
          - question: 没有收到邮件怎么办？
            answer: 先检查邮箱拼写、垃圾邮件箱和促销分类。发送或重发暂不可用时，请稍后重试；仍有问题再联系客户服务。
  support:
    status: published
    title: 联系客服
    description: 套餐券、套餐或付款有问题，请找客户服务。订位、问路和加菜，直接联系餐厅更方便。
    sections:
      - id: channels
        heading: 联系渠道
        paragraphs:
          - "邮件：info@palazzoitaliacina.com。写邮件时请附上领券用的邮箱和券面短码，方便我们查找。"
      - id: hours
        heading: 服务时间
        paragraphs:
          - "我们会尽快回复。订位、营业时间和菜品问题，直接联系餐厅更快，联系方式在餐厅页上。"
  subscribe:
    status: published
    title: 订阅中意公馆
    description: 新套餐和活动，不定期写信，可随时退订。
    sections:
      - id: newsletter
        heading: 会收到什么
        paragraphs:
          - 新套餐、当地活动和值得读的内容，不定期发送。
  subscribe/confirm:
    status: published
    title: 订阅确认
    description: 验证邮箱并确认后，才会加入邮件订阅。
    sections:
      - id: verification
        heading: 验证与确认
        paragraphs:
          - 验证邮箱并确认后，才会加入邮件订阅。
  subscribe/unsubscribe:
    status: published
    title: 退订
    description: 登录对应邮箱后确认退订，页面会显示实际订阅状态。
    sections:
      - id: verification
        heading: 验证与确认
        paragraphs:
          - 登录对应邮箱后确认退订，页面会显示实际订阅状态。
  legal:
    status: published
    title: "条款与政策"
    description: "使用本站即表示你同意以下用户条款，并了解我们如何处理你的数据。"
    sections:
      - id: effective
        heading: "生效日期"
        paragraphs:
          - "本页列出的条款与政策自 2026 年 11 月 6 日起生效。内容修改时，我们会更新生效日期；涉及你权利的重要变更，会提前通过邮件通知已注册的用户。"
  legal/terms:
    status: published
    title: "用户条款"
    description: "使用中意公馆网站和优惠券的规则。"
    sections:
      - id: seller
        heading: "本站与服务"
        paragraphs:
          - "中意公馆网站（以下称「本站」或「我们」）由中意公馆（Palazzo Italia-Cina）运营，联系邮箱 info@palazzoitaliacina.com。本站介绍意大利的餐厅，并发放合作餐厅的免费优惠券。我们不经营餐厅，也不出售餐饮。"
      - id: eligibility
        heading: "谁可以使用"
        paragraphs:
          - "使用本站须年满 14 周岁，并使用你本人可以收信的邮箱。优惠券仅供个人使用："
        bullets:
          - "不得转售优惠券，也不得用于商业目的。"
          - "不得用脚本或其他自动方式领券，也不得用多个邮箱重复领取同一活动的券。"
      - id: conditions
        heading: "优惠券与使用条件"
        paragraphs:
          - "优惠券免费领取，本站不向你收取任何费用。餐费在餐厅支付，餐厅是餐饮的销售方，价格、菜品和过敏原信息以餐厅为准。"
        bullets:
          - "同一账户（邮箱）在同一套餐下，同一时间只能持有一张有效券，且最多只能领取两张。"
          - "券只适用于券面写明的合作套餐，每张券只能核销一次，有效期截至券面日期（意大利时间）。"
          - "点餐前向店员出示券上的二维码或 6 位数字码，由店员核销。"
          - "核销不可撤销；如果是误操作，请联系我们更正。"
          - "优惠券不能兑换现金，过期后不能使用。"
          - "活动可能因餐厅原因暂停或结束。发现违反本条款的使用时，我们可以撤销相关的券；已核销的用餐不受影响。"
      - id: account
        heading: "账户与验证码"
        paragraphs:
          - "本站不设密码，用邮箱验证码登录。验证码十分钟内有效，请勿转发给他人，并妥善保管你的邮箱。账户被用于违反本条款的行为时，我们可以暂停该账户。"
      - id: responsibility
        heading: "信息与责任"
        paragraphs:
          - "店铺信息由我们核对后发布，但营业时间、菜单和价格可能变化，请以餐厅当天的信息为准。餐饮服务由餐厅提供并负责。"
          - "我们对本站自身的服务承担法律规定的责任。本条款不影响你作为消费者依法享有的任何权利。"
      - id: content
        heading: "内容与版权"
        paragraphs:
          - "本站的文字、照片和设计归我们或相应权利人所有，未经许可不得复制或用于商业用途。"
      - id: law
        heading: "适用法律与争议"
        paragraphs:
          - "本条款适用意大利法律。如果你是消费者，可以向你的居住地或住所地法院提起诉讼。"
          - "有任何问题或投诉，请先写信至 info@palazzoitaliacina.com，我们会尽快答复，争取友好解决。"
  legal/refunds:
    status: published
    title: "退款与延期"
    description: "免费券不涉及付款和退款；过期后不能延期。"
    sections:
      - id: withdrawal
        heading: "退款"
        paragraphs:
          - "目前的优惠券免费领取，本站不收取任何费用，因此没有线上付款，也不存在退款。"
          - "如将来提供需要付款的产品，退款和撤回规则会在购买前单独列明。"
      - id: extension
        heading: "有效期与延期"
        paragraphs:
          - "券的有效期写在券面上。过期后券自动失效，不能延期，也不能补发。"
      - id: exceptions
        heading: "遇到问题"
        paragraphs:
          - "券显示异常、餐厅无法兑现，或被误核销，请写信至 info@palazzoitaliacina.com，并附上领券邮箱和券面短码，我们会与餐厅核实处理。"
  legal/privacy:
    status: published
    title: "隐私政策"
    description: "我们处理哪些个人数据、为什么、保存多久，以及你有哪些权利。"
    sections:
      - id: controller
        heading: "数据控制者"
        paragraphs:
          - "中意公馆（Palazzo Italia-Cina）"
        bullets:
          - "邮箱：info@palazzoitaliacina.com"
      - id: processing
        heading: "处理哪些数据、用途与法律依据"
        paragraphs:
          - "我们只处理提供服务所需的数据："
        bullets:
          - "邮箱地址和登录记录：用于创建和登录账户、发送验证码和券邮件。依据：履行与你的约定（GDPR 第 6 条第 1 款 b 项）。"
          - "优惠券记录：券码，领取、核销和撤销的时间，以及对应的餐厅。用于提供优惠、防止重复使用、与餐厅对账。依据：履行约定，以及防止滥用的正当利益（同款 b 项与 f 项）。"
          - "邮件订阅：邮箱、语言和同意时间。只在你主动订阅后发送新套餐和活动邮件。依据：你的同意（a 项），可随时退订。"
          - "技术日志：IP 地址、浏览器信息和访问时间。用于网站安全和排查故障。依据：正当利益（f 项）。"
          - "匿名使用统计：仅在你同意后，记录匿名的使用事件（例如浏览了哪类页面、点了导航或领券按钮、是否点击“添加到桌面”）。不含邮箱，不含券令牌。依据：你的同意（a 项），可随时在“Cookie 设置”撤回。"
          - "海报渠道：如果你是扫描印刷海报上的二维码进入，领券时我们会在这张券上记下海报的渠道编号（例如 p1），用来了解哪张海报有效。只记渠道编号，不记录你的浏览行为；扫码本身只记入口、渠道、语言和时间，不记录 IP 地址和设备信息。依据：正当利益（f 项）。"
          - "Cookie 选择计数：你在 Cookie 横幅上的选择（接受或拒绝）按天累计成一个匿名数字，不含任何标识，用来了解横幅的接受率。依据：正当利益（f 项）。"
          - "你写给客服的内容：用于回复你的问题。依据：履行约定或回应你的请求。"
          - "合作餐厅员工：商家账户的邮箱和核销记录，用于商家端登录与对账。依据：履行与餐厅的合作约定。"
      - id: recipients
        heading: "数据接收方"
        paragraphs:
          - "核销时，合作餐厅能看到核销所需的券信息。我们不出售个人数据，不用于广告，也不做自动化决策或用户画像。"
          - "为运行本站，我们委托以下服务商代为处理数据：Supabase（数据库与登录，服务器位于欧盟法兰克福）、Resend（发送邮件）、Vercel（网站托管）；你同意统计后，还有 PostHog（匿名使用统计，服务器在欧盟）。Resend 和 Vercel 的总部在美国，数据传输以欧盟委员会的充分性决定（欧美数据隐私框架）或标准合同条款为依据。"
      - id: retention
        heading: "保存期限"
        paragraphs:
          - "数据只保存到达成用途所需的时间："
        bullets:
          - "账户和优惠券记录：保存到你要求删除账户为止，最长不超过最后一次使用后 24 个月。"
          - "邮件订阅数据：保存到你退订为止；退订记录会保留，以免再次给你发信。"
          - "技术日志：由托管服务商自动删除，一般不超过 30 天。"
          - "匿名使用统计：保存不超过 12 个月。"
          - "客服往来邮件：问题处理完毕后保存不超过 24 个月。"
          - "法律要求更长保存期限的，按法律规定保存。"
      - id: rights
        heading: "你的权利"
        paragraphs:
          - "我们未指定数据保护官。有关隐私的问题，请写信至 info@palazzoitaliacina.com。"
          - "你可以要求访问、更正、删除、限制处理或导出你的数据，可以反对基于正当利益的处理，也可以随时撤回同意（例如退订邮件），撤回不影响之前处理的合法性。"
          - "如需删除账户或行使其他权利，请用你的账户邮箱写信至 info@palazzoitaliacina.com，我们会在一个月内答复。你也可以向意大利数据保护机构（Garante per la protezione dei dati personali，www.garanteprivacy.it）投诉。"
  legal/cookies:
    status: published
    title: "Cookie 政策"
    description: "网站运行所必需的 Cookie 和浏览器存储不需要你同意；统计只在你点“全部接受”后才启用，不使用广告或第三方追踪 Cookie。"
    sections:
      - id: necessary
        heading: "必要 Cookie 与浏览器存储"
        paragraphs:
          - "以下内容是网站运行所必需的，依法不需要你的同意："
        bullets:
          - "登录 Cookie（名称以 sb- 开头）：登录后保持你的登录状态，退出或过期后删除。"
          - "语言选择（浏览器本地存储）：记住你选过的语言。"
          - "登录过程中的临时状态（仅保存在当前标签页，关闭后清除）。"
      - id: analytics
        heading: "统计与广告"
        paragraphs:
          - "统计工具只在你点「全部接受」后才启用；点「全部拒绝」或不选择，就不会发送任何统计数据。我们使用 PostHog（服务器在欧盟），不写入 Cookie：访客编号是一个随机数，只保存在你这台设备的浏览器存储里，不与邮箱或账户关联；你拒绝或撤回同意时会删除。"
          - "统计只记录匿名的使用事件，例如浏览的页面类型、点击导航或语言切换、点击导航到店或复制地址、开始领券，以及是否点击“添加到桌面”，页面路径中的券令牌会先去掉。不建立个人档案，不与邮箱或账户关联。购买、核销和退款以数据库和支付记录为准，不依赖统计。"
          - "本站不使用广告或第三方追踪 Cookie，也不嵌入第三方的地图、视频或社交按钮；餐厅页的地图链接会在新页面打开 Apple 地图或 Google 地图。"
      - id: settings
        heading: "管理 Cookie"
        paragraphs:
