translations:
  zh:
    name: PaStation 豪华套餐 1 · €8 优惠券
    summary: 豪华套餐 1，标价 €27，凭 €8 优惠券到店支付 €19。
    conditions: 仅限豪华套餐 1，堂食、外带均可，需在午餐 12:00–13:00 或晚餐 15:00–22:30（意大利当地时间）使用。每张券核销一次。红酒和水二选一。有效期见券面。
    allergens: 过敏原与忌口，请点单前问店员。
    courses:
      - name: 豪华套餐 1
        description: 番茄、马苏里拉奶酪及蘑菇烤面包；卡普雷塞沙拉（番茄、马苏里拉奶酪）；清炒菠菜；生火腿；肉酱粗管意面；提拉米苏；红酒或水二选一。
  it:
    name: PaStation Menù Deluxe 1 · coupon da 8 €
    summary: "Menù Deluxe 1: prezzo 27 €, paghi 19 € al ristorante con il coupon da 8 €."
    conditions: "Solo per il Menù Deluxe 1, da consumare al tavolo o da asporto, a pranzo dalle 12:00 alle 13:00 o a cena dalle 15:00 alle 22:30 (ora italiana). Una convalida per coupon. Vino rosso oppure acqua. La scadenza è sul coupon."
    allergens: Chiedi allo staff gli allergeni prima di ordinare.
    courses:
      - name: Menù Deluxe 1
        description: "Bruschette con pomodoro, mozzarella e funghi; caprese (pomodoro e mozzarella); spinaci saltati; prosciutto crudo; rigatoni al ragù; tiramisù; vino rosso oppure acqua."
  en:
    name: PaStation Deluxe Menu 1 · €8 coupon
    summary: "Deluxe Menu 1: €27, pay €19 at the restaurant with the €8 coupon."
    conditions: "For Deluxe Menu 1 only, valid for eating in or takeaway, at lunch (12:00–13:00) or dinner (15:00–22:30), Italian local time. One redemption per coupon. Choose red wine or water. Expiry is shown on the coupon."
    allergens: Ask staff about allergens before ordering.
    courses:
      - name: Deluxe Menu 1
        description: "Bruschetta with tomato, mozzarella and mushrooms; caprese (tomato and mozzarella); sautéed spinach; prosciutto; rigatoni with ragù; tiramisu; red wine or water."
