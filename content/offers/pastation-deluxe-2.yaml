translations:
  zh:
    name: PaStation 豪华套餐 2 · €8 优惠券
    summary: 豪华套餐 2，标价 €27，凭 €8 优惠券到店支付 €19。
    conditions: 仅限豪华套餐 2，堂食、外带均可，需在午餐 12:00–13:00 或晚餐 15:00–22:30（意大利当地时间）使用。每张券核销一次。红酒和水二选一。有效期见券面。
    allergens: 过敏原与忌口，请点单前问店员。
    courses:
      - name: 豪华套餐 2
        description: 帕尔马风味焗茄子；番茄汁牛肉丸；番茄、马苏里拉奶酪及肉酱烤面包；布拉塔奶酪配帕尔马生火腿；佛卡夏；提拉米苏；红酒或水二选一。
  it:
    name: PaStation Menù Deluxe 2 · coupon da 8 €
    summary: "Menù Deluxe 2: prezzo 27 €, paghi 19 € al ristorante con il coupon da 8 €."
    conditions: "Solo per il Menù Deluxe 2, da consumare al tavolo o da asporto, a pranzo dalle 12:00 alle 13:00 o a cena dalle 15:00 alle 22:30 (ora italiana). Una convalida per coupon. Vino rosso oppure acqua. La scadenza è sul coupon."
    allergens: Chiedi allo staff gli allergeni prima di ordinare.
    courses:
      - name: Menù Deluxe 2
        description: "Parmigiana di melanzane; polpette di manzo al pomodoro; bruschette con pomodoro, mozzarella e ragù; burrata e prosciutto crudo di Parma; focaccia; tiramisù; vino rosso oppure acqua."
  en:
    name: PaStation Deluxe Menu 2 · €8 coupon
    summary: "Deluxe Menu 2: €27, pay €19 at the restaurant with the €8 coupon."
    conditions: "For Deluxe Menu 2 only, valid for eating in or takeaway, at lunch (12:00–13:00) or dinner (15:00–22:30), Italian local time. One redemption per coupon. Choose red wine or water. Expiry is shown on the coupon."
    allergens: Ask staff about allergens before ordering.
    courses:
      - name: Deluxe Menu 2
        description: "Eggplant parmigiana; beef meatballs in tomato sauce; bruschetta with tomato, mozzarella and ragù; burrata with Parma prosciutto; focaccia; tiramisu; red wine or water."
